<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Clio · 记忆工作台</title>
  <link rel="stylesheet" href="styles.css?v=20260825-causality-1" />
  <link rel="stylesheet" href="styles.extra.css?v=20260825-causality-1" />
  <link rel="stylesheet" href="styles.runtime.css?v=20260826-push-ack-2" />
  <link rel="stylesheet" href="styles.v2.css?v=20260825-causality-1" />
  <link rel="stylesheet" href="mobile.runtime.css?v=20260907-nursery-home-2" />
</head>
<body>
  <section id="login" class="login-screen">
    <div class="login-scene-shimmer" aria-hidden="true"></div>
    <img class="login-leaf-motion" src="./assets/login-leaf-isolated-clean.png" alt="" aria-hidden="true" />
    <div class="login-brand-corner" aria-label="Clio Memory"><strong>Clio</strong><span>Memory</span></div>
    <div class="login-content">
      <div class="login-title-lockup"><strong>Clio</strong><span>Memory</span></div>
      <p class="login-subtitle">让重要的经历，在下一次相遇时仍然被记得。</p>
      <form id="loginForm" class="login-form">
        <label for="password">管理密码</label>
        <div class="login-password-field">
          <input id="password" type="password" placeholder="请输入管理密码" autocomplete="off" />
          <button id="togglePassword" class="password-toggle" type="button" aria-label="显示密码" aria-pressed="false"></button>
        </div>
        <small id="loginHint"></small>
        <button class="login-submit" type="submit">进入记忆 <span>↗</span></button>
        <button class="recovery-link" type="button" data-action="password">忘记密码？查看恢复说明</button>
      </form>
      <div class="login-trust"><span>数据只保存在你的记忆系统中。</span></div>
    </div>
    <footer><span>PRIVATE MEMORY</span><span>CLIO WORKSPACE</span></footer>
  </section>

  <div id="app" class="app" hidden>
    <aside class="sidebar map-sidebar">
      <div class="brand"><span>✦</span><div><strong>Clio</strong><small>记忆工作台</small></div></div>
      <div class="local-status"><i></i><span>私密工作台</span><b>已开启</b></div>
      <button class="new-session" data-map-target="core">＋ <span>回到此刻</span></button>
      <nav class="sidebar-nav" aria-label="状态地图图层">
        <p>观测</p>
        <button data-map-target="memory"><span>◈</span>记忆库</button>
        <button data-map-target="timeline"><span>⌁</span>事实时间线</button>
        <button data-map-target="search"><span>⌕</span>智能搜索</button>
        <p>内在</p>
        <button data-map-target="hormones"><span>≈</span>激素状态</button>
        <button data-map-target="thoughts"><span>✧</span>念痕</button>
        <button data-map-target="mind"><span>☾</span>心念</button>
        <button data-map-target="resonance"><span>◎</span>内在牵引</button>
        <button data-map-target="darkflow"><span>∿</span>暗涌</button>
        <button data-map-target="behavior"><span>↗</span>行为与推送</button>
        <button data-map-target="personality"><span>✦</span>性格轨迹</button>
        <button data-map-target="coordinates"><span>◎</span>心智经纬</button>
        <p>工作台</p>
        <button data-map-target="mailbox"><span>□</span>信箱</button>
        <button data-map-target="tasks"><span>✓</span>未竟</button>
        <button data-map-target="treasury"><span>◌</span>AI 小金库</button>
        <button data-map-target="toolbox"><span>⊞</span>工具箱</button>
      </nav>
      <button class="settings-link" data-map-target="settings"><span>⚙</span>设置与安全</button>
    </aside>

    <main class="main map-main">
      <header class="topbar"><div><small id="pageKicker">CLIO STATE MAP</small><h2 id="pageTitle">此刻</h2></div><div class="top-actions"><button class="search-pill" data-map-target="search"><span>⌕</span><span>在地图里寻找记忆、事件或信箱</span><kbd>⌘ K</kbd></button><button class="avatar" data-map-target="settings">沈</button></div></header>
      <div id="content" class="content"></div>
    </main>

    <nav class="mobile-nav"><button data-map-target="core" class="active"><span>⌂</span>此刻</button><button data-map-target="memory"><span>◈</span>记忆</button><button data-map-target="timeline"><span>⌁</span>时间</button><button data-map-target="hormones"><span>≈</span>内在</button><button data-map-target="more"><span>＋</span>更多</button></nav>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script src="lucide.min.js?v=20260828-anima-mobile-3"></script>
  <script src="app.js?v=20260826-home-takeover-2"></script>
  <script src="app.runtime.js?v=20260827-ledger-push-ack-1"></script>
  <script src="mobile.runtime.js?v=20260907-nursery-home-2"></script>
</body>
</html>
