    assisted_from: infancy
    independent_from: infancy
    initialization: stage_baseline
    evidence_sessions: 1
  - id: language.gesture_intent
    dimension: language_expression
    label: "用伸手、挥手、指向或转头表达意图"
    emerging_from: infancy
    assisted_from: infancy
    independent_from: early_walker
    initialization: stage_baseline
    evidence_sessions: 2
  - id: language.directed_caregiver_name
    dimension: language_expression
    label: "有指向地称呼熟悉养育者"
    emerging_from: infancy
    assisted_from: early_walker
    independent_from: early_walker
    initialization: stage_baseline
    evidence_sessions: 2
  - id: language.meaningful_single_word
