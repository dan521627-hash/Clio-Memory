    assisted_from: early_walker
    independent_from: early_walker
    initialization: stage_baseline
    evidence_sessions: 2
  - id: language.two_word_combination
    dimension: language_expression
    label: "组合两个或三个词表达需要"
    emerging_from: early_walker
    assisted_from: early_walker
    independent_from: toddler
    initialization: stage_baseline
    evidence_sessions: 2
  - id: language.short_sentence
    dimension: language_expression
    label: "使用短句表达需要、所有权和简单经历"
    emerging_from: toddler
    assisted_from: toddler
    independent_from: toddler
    initialization: stage_baseline
    evidence_sessions: 2
  - id: language.reciprocal_conversation
    dimension: language_expression
    label: "进行多轮来回对话"
    emerging_from: toddler
    assisted_from: toddler
    independent_from: young_child
    initialization: stage_baseline
    evidence_sessions: 3
  - id: language.simple_story
    dimension: language_expression
    label: "讲述有简单顺序的故事或一天经历"
    emerging_from: young_child
    assisted_from: young_child
    independent_from: young_child
    initialization: stage_baseline
