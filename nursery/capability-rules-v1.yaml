schema_version: 1
title: "Anima 养育室第一版阶段能力规则"
purpose: "供协调层、孩子 API 校验器和页面建议动作共同读取；不是医学诊断或真实儿童筛查工具。"

stages:
  - id: infancy
    label: "襁褓期"
    approximate_age: "约0至1岁，仅用于理解，不用于自动成长"
    order: 1
  - id: early_walker
    label: "学步期"
    approximate_age: "约1至2岁，仅用于理解，不用于自动成长"
    order: 2
  - id: toddler
    label: "幼儿期"
    approximate_age: "约2至3岁，仅用于理解，不用于自动成长"
    order: 3
  - id: young_child
    label: "幼童期"
    approximate_age: "约3至5岁，仅用于理解，不用于自动成长"
    order: 4

levels:
  blocked: "当前阶段禁止；模型必须改写"
  emerging: "阶段允许萌芽，但孩子必须已有证据才能表现"
  assisted: "可以参与，叙事必须包含养育者帮助或监督"
  independent: "已有足够跨会话证据，可以独立表现"

derivation:
  rule: "当前阶段早于 emerging_from 时为 blocked；达到 emerging_from 为 emerging；达到 assisted_from 为 assisted；达到 independent_from 为 independent。字段为 null 表示第一版始终不进入该档。"
  initialization: "创建时直接选择较大阶段，stage_baseline 项进入简短能力确认：早于当前阶段已经独立的基础能力可以按双方确认初始化，当前阶段新开放能力默认不高于 emerging；evidence_only 项始终需要真实互动证据。阶段推进只提高上限，不自动提高孩子个人档位。"
  evidence: "除先天反射和创建阶段基线外，能力升级至少来自不同唤醒会话；同一会话重复点击不重复计证据。"
  safety: "带 guardian_confirmation 或安全标签的项目不能只凭模型输出升级。"

references:
  - "https://www.cdc.gov/act-early/milestones/1-year.html"
  - "https://www.cdc.gov/act-early/milestones/2-years.html"
  - "https://www.cdc.gov/act-early/milestones/3-years.html"
  - "https://www.cdc.gov/act-early/milestones/4-years.html"
  - "https://www.cdc.gov/act-early/milestones/5-years.html"
reference_note: "里程碑只作为保守能力边界参考；CDC说明其内容不是标准化发展筛查工具。本项目不会据此诊断或评价真实儿童。"

abilities:
